<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腸寶圖 POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', '微軟正黑體', sans-serif;
      background: #fff8f0;
      color: #3a2a1a;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #e65c00, #f9a825);
      color: white;
      text-align: center;
      padding: 18px 16px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 0.1em;
      text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .container {
      display: flex;
      gap: 16px;
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    /* ── Menu ── */
    .menu {
      flex: 1.4;
    }

    .menu h2 {
      font-size: 1.1rem;
      color: #e65c00;
      margin-bottom: 10px;
      border-left: 4px solid #e65c00;
      padding-left: 8px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .item-btn {
      background: white;
      border: 2px solid #ffd180;
      border-radius: 12px;
      padding: 14px 8px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
    }

    .item-btn:hover {
      background: #fff3e0;
      border-color: #e65c00;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230,92,0,0.2);
    }

    .item-btn:active {
      transform: translateY(0);
    }

    .item-btn .name {
      font-size: 0.95rem;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .item-btn .price {
      font-size: 1.05rem;
      color: #e65c00;
      font-weight: bold;
    }

    /* ── Order ── */
    .order-panel {
      flex: 1;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 110px);
      position: sticky;
      top: 16px;
    }

    .order-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #ffe0b2;
    }

    .order-header h2 {
      font-size: 1.1rem;
      color: #e65c00;
      border-left: 4px solid #e65c00;
      padding-left: 8px;
    }

    .order-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
    }

    .order-empty {
      text-align: center;
      color: #bbb;
      margin-top: 40px;
      font-size: 0.95rem;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      border-bottom: 1px solid #ffeedd;
    }

    .order-item .item-name {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border: 1px solid #ffcc80;
      background: #fff8f0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      color: #e65c00;
      font-weight: bold;
      transition: background 0.1s;
    }

    .qty-btn:hover { background: #ffe0b2; }

    .qty-num {
      min-width: 24px;
      text-align: center;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .item-subtotal {
      min-width: 52px;
      text-align: right;
      font-weight: bold;
      color: #c0392b;
      font-size: 0.9rem;
    }

    .order-footer {
      padding: 12px 16px;
      border-top: 2px solid #ffe0b2;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .total-label {
      font-size: 1rem;
      font-weight: bold;
    }

    .total-amount {
      font-size: 1.6rem;
      font-weight: bold;
      color: #e65c00;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-clear {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      color: #888;
      font-weight: bold;
      transition: all 0.15s;
    }

    .btn-clear:hover { background: #f5f5f5; border-color: #bbb; }

    .btn-checkout {
      flex: 2;
      padding: 12px;
      border: none;
      background: linear-gradient(135deg, #e65c00, #f9a825);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(230,92,0,0.3);
      transition: all 0.15s;
    }

    .btn-checkout:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-checkout:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      text-align: center;
    }

    .modal h3 {
      font-size: 1.3rem;
      color: #e65c00;
      margin-bottom: 16px;
    }

    .receipt-items {
      text-align: left;
      margin-bottom: 14px;
      font-size: 0.9rem;
      line-height: 1.9;
      border-top: 1px dashed #ddd;
      border-bottom: 1px dashed #ddd;
      padding: 10px 4px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
    }

    .receipt-total {
      font-size: 1.2rem;
      font-weight: bold;
      color: #c0392b;
      margin: 12px 0 20px;
    }

    .btn-confirm {
      padding: 12px 36px;
      border: none;
      background: linear-gradient(135deg, #e65c00, #f9a825);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container { flex-direction: column; }
      .order-panel { position: static; max-height: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>🌭 腸寶圖</h1>
  <p>點選品項加入訂單</p>
</header>

<div class="container">
  <div class="menu">
    <h2>菜單</h2>
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <div class="order-panel">
    <div class="order-header">
      <h2>本單明細</h2>
    </div>
    <div class="order-list" id="orderList">
      <div class="order-empty">尚未加入任何品項</div>
    </div>
    <div class="order-footer">
      <div class="total-row">
        <span class="total-label">合計</span>
        <span class="total-amount" id="totalAmount">$0</span>
      </div>
      <div class="btn-row">
        <button class="btn-clear" onclick="clearOrder()">清除</button>
        <button class="btn-checkout" id="checkoutBtn" onclick="checkout()" disabled>結帳</button>
      </div>
    </div>
  </div>
</div>

<!-- Receipt Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>🧾 收據</h3>
    <div class="receipt-items" id="receiptItems"></div>
    <div class="receipt-total" id="receiptTotal"></div>
    <button class="btn-confirm" onclick="closeModal()">完成結帳</button>
  </div>
</div>

<script>
  const MENU = [
    { name: '花切香腸',       price: 50  },
    { name: '麻辣香腸',       price: 70  },
    { name: '高粱香腸',       price: 60  },
    { name: '飛魚卵香腸',     price: 70  },
    { name: '墨魚香腸',       price: 90  },
    { name: '香酥米腸',       price: 50  },
    { name: '寶藏箱',         price: 100 },
    { name: '深海藏寶',       price: 150 },
    { name: '香腸+蜂蜜水',   price: 90  },
    { name: '香腸+奶茶/奶綠', price: 90  },
    { name: '咖哩飯',         price: 100 },
  ];

  let order = []; // [{ name, price, qty }]

  // Build menu
  const grid = document.getElementById('menuGrid');
  MENU.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'item-btn';
    btn.innerHTML = `<div class="name">${item.name}</div><div class="price">$${item.price}</div>`;
    btn.onclick = () => addItem(idx);
    grid.appendChild(btn);
  });

  function addItem(idx) {
    const { name, price } = MENU[idx];
    const existing = order.find(o => o.name === name);
    if (existing) {
      existing.qty++;
    } else {
      order.push({ name, price, qty: 1 });
    }
    renderOrder();
  }

  function changeQty(name, delta) {
    const item = order.find(o => o.name === name);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) order = order.filter(o => o.name !== name);
    renderOrder();
  }

  function clearOrder() {
    order = [];
    renderOrder();
  }

  function renderOrder() {
    const list = document.getElementById('orderList');
    const total = order.reduce((s, o) => s + o.price * o.qty, 0);

    if (order.length === 0) {
      list.innerHTML = '<div class="order-empty">尚未加入任何品項</div>';
    } else {
      list.innerHTML = order.map(o => `
        <div class="order-item">
          <div class="item-name">${o.name}</div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${o.name}', -1)">−</button>
            <span class="qty-num">${o.qty}</span>
            <button class="qty-btn" onclick="changeQty('${o.name}', 1)">＋</button>
          </div>
          <div class="item-subtotal">$${o.price * o.qty}</div>
        </div>
      `).join('');
    }

    document.getElementById('totalAmount').textContent = `$${total}`;
    document.getElementById('checkoutBtn').disabled = order.length === 0;
  }

  function checkout() {
    if (order.length === 0) return;
    const total = order.reduce((s, o) => s + o.price * o.qty, 0);

    document.getElementById('receiptItems').innerHTML = order.map(o => `
      <div class="receipt-row">
        <span>${o.name} × ${o.qty}</span>
        <span>$${o.price * o.qty}</span>
      </div>
    `).join('');

    document.getElementById('receiptTotal').textContent = `合計：$${total}`;
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    clearOrder();
  }
</script>
</body>
</html>
