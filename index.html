<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腸寶圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:      #f4ede0;
      --paper2:     #ede4d3;
      --ink:        #2b1d0e;
      --ink-light:  #6b4f35;
      --accent:     #9c4a1a;
      --accent2:    #c47b3a;
      --sage:       #6b7c5c;
      --rule:       #c8b89a;
      --white:      #fdf9f3;
      --danger:     #b83232;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background-color: var(--paper);
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 27px,
        rgba(180,160,130,0.12) 27px, rgba(180,160,130,0.12) 28px
      );
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--ink);
      color: var(--paper);
      text-align: center;
      padding: 22px 20px 18px;
      position: relative;
    }
    header::before {
      content: '';
      position: absolute;
      top: 6px; left: 0; right: 0; height: 3px;
      background: repeating-linear-gradient(90deg, var(--accent2) 0, var(--accent2) 8px, transparent 8px, transparent 14px);
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 1px;
      background: var(--rule);
      opacity: 0.3;
    }
    .header-inner {
      display: inline-block;
      border: 1px solid var(--accent2);
      padding: 8px 36px;
      position: relative;
    }
    .header-inner::before { content: '✦'; position: absolute; color: var(--accent2); top: 50%; transform: translateY(-50%); left: -18px; font-size: 0.65rem; }
    .header-inner::after  { content: '✦'; position: absolute; color: var(--accent2); top: 50%; transform: translateY(-50%); right: -18px; font-size: 0.65rem; }
    header h1 {
      font-family: 'Playfair Display', 'Noto Serif TC', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.25em;
    }
    header p {
      font-size: 0.68rem;
      letter-spacing: 0.35em;
      color: var(--accent2);
      margin-top: 4px;
    }

    /* ── Tab Nav ── */
    .tab-nav {
      display: flex;
      background: var(--ink);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: rgba(244,237,224,0.5);
      font-family: 'Noto Serif TC', serif;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .tab-btn.active {
      color: var(--accent2);
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 2px;
      background: var(--accent2);
      border-radius: 2px 2px 0 0;
    }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── POS Layout ── */
    .container {
      display: flex;
      gap: 20px;
      padding: 22px 20px;
      max-width: 980px;
      margin: 0 auto;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--ink-light);
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .section-label::before, .section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--rule);
    }

    /* ── Menu ── */
    .menu { flex: 1.5; }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
      gap: 10px;
    }
    .item-btn {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 16px 10px 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
      position: relative;
      box-shadow: 2px 3px 0 var(--paper2);
    }
    .item-btn::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px dashed transparent;
      border-radius: 2px;
      transition: border-color 0.18s;
      pointer-events: none;
    }
    .item-btn:hover {
      background: #fff9f2;
      border-color: var(--accent);
      transform: translate(-1px, -1px);
      box-shadow: 3px 4px 0 var(--accent2);
    }
    .item-btn:hover::after { border-color: var(--accent2); }
    .item-btn:active { transform: translate(0,0); box-shadow: 1px 1px 0 var(--paper2); }
    .item-btn .name { font-size: 0.88rem; font-weight: 600; line-height: 1.45; margin-bottom: 8px; }
    .item-btn .price {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--white);
      background: var(--accent);
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* ── Order Panel ── */
    .order-panel {
      flex: 1;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      box-shadow: 3px 4px 0 var(--paper2);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 160px);
      position: sticky;
      top: 20px;
    }
    .order-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
    .order-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }
    .order-list::-webkit-scrollbar { width: 3px; }
    .order-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }
    .order-empty {
      text-align: center;
      color: var(--rule);
      margin-top: 40px;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      line-height: 2.2;
    }
    .order-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 2px;
      border-bottom: 1px dashed var(--rule);
    }
    .order-item .item-name { flex: 1; font-size: 0.84rem; }
    .qty-ctrl { display: flex; align-items: center; gap: 4px; }
    .qty-btn {
      width: 24px; height: 24px;
      border: 1px solid var(--rule);
      background: var(--paper);
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--ink-light);
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .qty-btn:hover { background: var(--paper2); border-color: var(--accent); color: var(--accent); }
    .qty-num { min-width: 22px; text-align: center; font-size: 0.9rem; font-weight: 600; }
    .item-subtotal { min-width: 46px; text-align: right; font-size: 0.84rem; color: var(--accent); font-weight: 600; }

    .order-footer { padding: 12px 16px; border-top: 1px solid var(--rule); }
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--rule);
    }
    .total-label { font-size: 0.68rem; letter-spacing: 0.3em; color: var(--ink-light); text-transform: uppercase; }
    .total-amount { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 700; color: var(--accent); }

    .btn-row { display: flex; gap: 8px; }
    .btn-clear {
      flex: 1; padding: 11px;
      border: 1px solid var(--rule);
      background: transparent;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.15em;
      color: var(--ink-light);
      transition: all 0.15s;
    }
    .btn-clear:hover { background: var(--paper); border-color: var(--ink-light); }
    .btn-checkout {
      flex: 2; padding: 11px;
      border: none;
      background: var(--ink);
      color: var(--paper);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.2em;
      font-weight: 600;
      transition: all 0.15s;
      position: relative;
    }
    .btn-checkout::before {
      content: '';
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 2px;
      pointer-events: none;
    }
    .btn-checkout:hover { background: var(--accent); }
    .btn-checkout:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Checkout Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(43,29,14,0.65);
      z-index: 100;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 28px 26px 24px;
      max-width: 380px;
      width: 92%;
      box-shadow: 6px 8px 0 var(--paper2), 0 20px 60px rgba(43,29,14,0.3);
    }
    .modal-stamp {
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.4em;
      color: var(--accent2);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--ink);
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--rule);
    }
    .receipt-items {
      font-size: 0.83rem;
      line-height: 2;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--rule);
    }
    .receipt-row { display: flex; justify-content: space-between; color: var(--ink-light); }
    .receipt-row span:last-child { color: var(--accent); font-weight: 600; }
    .receipt-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0 14px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 16px;
    }
    .receipt-total-label { font-size: 0.68rem; letter-spacing: 0.25em; color: var(--ink-light); text-transform: uppercase; }
    .receipt-total-amt { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--accent); font-weight: 700; }

    /* Payment input */
    .payment-section { margin-bottom: 14px; }
    .quick-cash {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .btn-quick {
      flex: 1;
      padding: 7px 4px;
      border: 1px solid var(--rule);
      background: var(--paper);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: 'Noto Serif TC', serif;
      color: var(--ink-light);
      letter-spacing: 0.05em;
      transition: all 0.12s;
    }
    .btn-quick:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .btn-quick.active { background: var(--accent); color: var(--paper); border-color: var(--accent); }
    .payment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .payment-label { font-size: 0.78rem; letter-spacing: 0.1em; color: var(--ink-light); }
    .payment-input {
      width: 120px;
      padding: 6px 10px;
      border: 1px solid var(--rule);
      border-radius: 3px;
      background: var(--paper);
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--ink);
      text-align: right;
      outline: none;
      transition: border-color 0.15s;
    }
    .payment-input:focus { border-color: var(--accent); }
    .change-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 8px 12px;
    }
    .change-label { font-size: 0.78rem; letter-spacing: 0.1em; color: var(--ink-light); }
    .change-amount {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--sage);
    }
    .change-amount.insufficient { color: var(--danger); }

    .modal-btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn-modal-cancel {
      flex: 1; padding: 11px;
      border: 1px solid var(--rule);
      background: transparent;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.15em;
      color: var(--ink-light);
    }
    .btn-modal-cancel:hover { background: var(--paper); }
    .btn-modal-confirm {
      flex: 2; padding: 11px;
      border: none;
      background: var(--ink);
      color: var(--paper);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.2em;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-modal-confirm:hover { background: var(--accent); }
    .btn-modal-confirm:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Records View ── */
    .records-container {
      max-width: 820px;
      margin: 0 auto;
      padding: 22px 20px;
    }
    .records-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .records-date { font-size: 0.72rem; letter-spacing: 0.25em; color: var(--ink-light); }
    .btn-refresh {
      padding: 7px 16px;
      border: 1px solid var(--rule);
      background: var(--white);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.1em;
      color: var(--ink-light);
      transition: all 0.15s;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

    .records-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 2px 3px 0 var(--paper2);
      font-size: 0.82rem;
    }
    .records-table thead tr {
      background: var(--ink);
      color: var(--paper);
    }
    .records-table th {
      padding: 10px 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      font-size: 0.72rem;
      text-align: left;
    }
    .records-table th:last-child { text-align: center; }
    .records-table td {
      padding: 9px 12px;
      border-bottom: 1px dashed var(--rule);
      vertical-align: middle;
      color: var(--ink-light);
    }
    .records-table tbody tr:last-child td { border-bottom: none; }
    .records-table tbody tr:hover td { background: #fdf7ee; }
    .td-time { white-space: nowrap; font-size: 0.78rem; color: var(--ink-light); }
    .td-items { line-height: 1.7; color: var(--ink); }
    .td-total { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
    .td-cash { font-size: 0.82rem; color: var(--ink-light); white-space: nowrap; }
    .td-change { font-size: 0.82rem; color: var(--sage); font-weight: 600; white-space: nowrap; }
    .td-action { text-align: center; }
    .btn-delete {
      padding: 4px 12px;
      border: 1px solid #e0c0c0;
      background: #fff5f5;
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.72rem;
      color: var(--danger);
      letter-spacing: 0.05em;
      transition: all 0.15s;
      font-family: 'Noto Serif TC', serif;
    }
    .btn-delete:hover { background: var(--danger); color: white; border-color: var(--danger); }

    .records-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--rule);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      line-height: 2.2;
    }
    .records-loading {
      text-align: center;
      padding: 48px;
      color: var(--ink-light);
      font-size: 0.82rem;
      letter-spacing: 0.2em;
    }

    .records-summary {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .summary-card {
      flex: 1;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 14px 16px;
      box-shadow: 2px 3px 0 var(--paper2);
      text-align: center;
    }
    .summary-card .s-label { font-size: 0.65rem; letter-spacing: 0.25em; color: var(--ink-light); text-transform: uppercase; margin-bottom: 6px; }
    .summary-card .s-val { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--accent); font-weight: 700; }

    /* ── Confirm Delete Modal ── */
    .confirm-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(43,29,14,0.6);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .confirm-overlay.show { display: flex; }
    .confirm-box {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 28px 24px;
      max-width: 320px;
      width: 90%;
      text-align: center;
      box-shadow: 4px 6px 0 var(--paper2);
    }
    .confirm-box h4 { font-size: 1rem; color: var(--danger); margin-bottom: 10px; }
    .confirm-box p { font-size: 0.82rem; color: var(--ink-light); line-height: 1.7; margin-bottom: 20px; }
    .confirm-btns { display: flex; gap: 8px; }
    .btn-cancel-del { flex: 1; padding: 10px; border: 1px solid var(--rule); background: transparent; border-radius: 3px; cursor: pointer; font-size: 0.8rem; font-family: 'Noto Serif TC', serif; color: var(--ink-light); }
    .btn-confirm-del { flex: 1; padding: 10px; border: none; background: var(--danger); color: white; border-radius: 3px; cursor: pointer; font-size: 0.8rem; font-family: 'Noto Serif TC', serif; letter-spacing: 0.1em; }

    @media (max-width: 620px) {
      .container { flex-direction: column; padding: 14px; }
      .order-panel { position: static; max-height: none; }
      header h1 { font-size: 1.65rem; }
      .records-summary { flex-direction: column; }
      .records-table th:nth-child(4),
      .records-table td:nth-child(4),
      .records-table th:nth-child(5),
      .records-table td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>腸寶圖</h1>
    <p>Sausage Treasure Map · 手作香腸小攤</p>
  </div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('pos')">收　銀　台</button>
  <button class="tab-btn" onclick="switchTab('records')">今　日　記　錄</button>
</nav>

<!-- ══ POS View ══ -->
<div id="view-pos" class="view active">
  <div class="container">
    <div class="menu">
      <div class="section-label">本日菜單</div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div class="order-panel">
      <div class="order-header">
        <div class="section-label" style="margin-bottom:0">本單明細</div>
      </div>
      <div class="order-list" id="orderList">
        <div class="order-empty">— 尚無品項 —<br><span style="font-size:0.72rem">點選左側加入訂單</span></div>
      </div>
      <div class="order-footer">
        <div class="total-row">
          <span class="total-label">Total</span>
          <span class="total-amount" id="totalAmount">$0</span>
        </div>
        <div class="btn-row">
          <button class="btn-clear" onclick="clearOrder()">清　除</button>
          <button class="btn-checkout" id="checkoutBtn" onclick="openCheckout()" disabled>結　帳</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ Records View ══ -->
<div id="view-records" class="view">
  <div class="records-container">
    <div class="records-topbar">
      <span class="records-date" id="recordsDate"></span>
      <button class="btn-refresh" onclick="loadRecords()">↻ 重新整理</button>
    </div>
    <div id="recordsBody">
      <div class="records-loading">載入中⋯</div>
    </div>
    <div class="records-summary" id="recordsSummary" style="display:none">
      <div class="summary-card">
        <div class="s-label">訂單數</div>
        <div class="s-val" id="sumCount">0</div>
      </div>
      <div class="summary-card">
        <div class="s-label">今日營業額</div>
        <div class="s-val" id="sumTotal">$0</div>
      </div>
      <div class="summary-card">
        <div class="s-label">平均客單</div>
        <div class="s-val" id="sumAvg">$0</div>
      </div>
    </div>
  </div>
</div>

<!-- ══ Checkout Modal ══ -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <div class="modal-stamp">✦ &nbsp; 結 帳 明 細 &nbsp; ✦</div>
    <h3>腸寶圖</h3>
    <div class="receipt-items" id="receiptItems"></div>
    <div class="receipt-total-row">
      <span class="receipt-total-label">應付金額</span>
      <span class="receipt-total-amt" id="receiptTotal">$0</span>
    </div>
    <div class="payment-section">
      <div class="quick-cash" id="quickCash">
        <button class="btn-quick" onclick="setQuickCash(100)">$100</button>
        <button class="btn-quick" onclick="setQuickCash(200)">$200</button>
        <button class="btn-quick" onclick="setQuickCash(500)">$500</button>
        <button class="btn-quick" onclick="setQuickCash(1000)">$1000</button>
      </div>
      <div class="payment-row">
        <span class="payment-label">收款金額</span>
        <input type="number" class="payment-input" id="cashInput" min="0" placeholder="0" oninput="onCashInput()" />
      </div>
      <div class="change-row">
        <span class="change-label">找　零</span>
        <span class="change-amount" id="changeDisplay">—</span>
      </div>
    </div>
    <div class="modal-btn-row">
      <button class="btn-modal-cancel" onclick="closeCheckout()">取消</button>
      <button class="btn-modal-confirm" id="confirmBtn" onclick="confirmCheckout()">確認收款</button>
    </div>
  </div>
</div>

<!-- ══ Delete Confirm Modal ══ -->
<div class="confirm-overlay" id="confirmDel">
  <div class="confirm-box">
    <h4>確認刪除</h4>
    <p id="confirmDelText">確定要刪除這筆訂單嗎？<br>此操作無法復原。</p>
    <div class="confirm-btns">
      <button class="btn-cancel-del" onclick="closeConfirmDel()">取消</button>
      <button class="btn-confirm-del" onclick="doDelete()">刪除</button>
    </div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwilucXQ-BSXgXSh7NpQQxI77eYOmYSChWmizG8VyEXBy7_ZoG0oSG8VkzHDMH8PIwClA/exec';

  const MENU = [
    { name: '花切香腸',          price: 50,  type: 'sausage' },
    { name: '麻辣香腸',          price: 70,  type: 'sausage' },
    { name: '高粱香腸',          price: 60,  type: 'sausage' },
    { name: '飛魚卵香腸',        price: 70,  type: 'sausage' },
    { name: '墨魚香腸',          price: 90,  type: 'sausage' },
    { name: '香酥米腸',          price: 50,  type: 'sausage' },
    { name: '寶藏箱',            price: 100, type: 'other'   },
    { name: '深海藏寶',          price: 150, type: 'other'   },
    { name: '咖哩飯(小)',        price: 40,  type: 'other'   },
    { name: '咖哩飯(大)',        price: 150, type: 'other'   },
    { name: '蜂蜜水(小)',        price: 40,  type: 'drink'   },
    { name: '蜂蜜水(大)',        price: 80,  type: 'drink'   },
    { name: '奶茶/奶綠(小)',    price: 40,  type: 'drink'   },
    { name: '奶茶/奶綠(大)',    price: 80,  type: 'drink'   },
    { name: '泳圈吊飾(帶燈橘)', price: 750, type: 'merch'   },
    { name: '泳圈吊飾(橘)',      price: 400, type: 'merch'   },
    { name: '泳圈吊飾(綠)',      price: 380, type: 'merch'   },
    { name: '貼紙一張',          price: 60,  type: 'merch'   },
    { name: '貼紙一包(6張)',     price: 300, type: 'merch'   },
    { name: '紅包一張',          price: 40,  type: 'merch'   },
  ];

  let order = [];
  let currentTotal = 0;
  let pendingDeleteRow = null;

  // ── Build menu ──
  const GROUPS = [
    { label: '香腸',     types: ['sausage'] },
    { label: '套餐 ／ 飲料', types: ['other', 'drink'] },
    { label: '周邊商品', types: ['merch'] },
  ];
  const grid = document.getElementById('menuGrid');
  GROUPS.forEach(group => {
    const items = MENU.map((item, idx) => ({ item, idx })).filter(({ item }) => group.types.includes(item.type));
    const header = document.createElement('div');
    header.style.cssText = 'grid-column:1/-1;font-size:0.65rem;letter-spacing:0.25em;color:var(--ink-light);padding:4px 0 2px;border-bottom:1px solid var(--rule);margin-top:4px;';
    header.textContent = group.label;
    grid.appendChild(header);
    items.forEach(({ item, idx }) => {
      const btn = document.createElement('button');
      btn.className = 'item-btn';
      btn.innerHTML = `<div class="name">${item.name}</div><div class="price">$ ${item.price}</div>`;
      btn.onclick = () => addItem(idx);
      grid.appendChild(btn);
    });
  });

  // ── Tab ──
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'pos') || (i === 1 && tab === 'records'));
    });
    document.getElementById('view-pos').classList.toggle('active', tab === 'pos');
    document.getElementById('view-records').classList.toggle('active', tab === 'records');
    if (tab === 'records') loadRecords();
  }

  // ── POS ──
  function addItem(idx) {
    const { name, price } = MENU[idx];
    const existing = order.find(o => o.name === name);
    existing ? existing.qty++ : order.push({ name, price, qty: 1 });
    renderOrder();
  }

  function changeQty(name, delta) {
    const item = order.find(o => o.name === name);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) order = order.filter(o => o.name !== name);
    renderOrder();
  }

  function clearOrder() { order = []; renderOrder(); }

  function calcDiscount() {
    const sausageQty = order.filter(o => MENU.find(m => m.name === o.name)?.type === 'sausage').reduce((s, o) => s + o.qty, 0);
    const drinkQty   = order.filter(o => MENU.find(m => m.name === o.name)?.type === 'drink').reduce((s, o) => s + o.qty, 0);
    return Math.min(sausageQty, drinkQty) * 10;
  }

  function renderOrder() {
    const list = document.getElementById('orderList');
    const subtotal = order.reduce((s, o) => s + o.price * o.qty, 0);
    const discount = calcDiscount();
    currentTotal = subtotal - discount;

    if (order.length === 0) {
      list.innerHTML = '<div class="order-empty">— 尚無品項 —<br><span style="font-size:0.72rem">點選左側加入訂單</span></div>';
    } else {
      const itemRows = order.map(o => `
        <div class="order-item">
          <div class="item-name">${o.name}</div>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty('${o.name}',-1)">−</button>
            <span class="qty-num">${o.qty}</span>
            <button class="qty-btn" onclick="changeQty('${o.name}',1)">+</button>
          </div>
          <div class="item-subtotal">$${o.price * o.qty}</div>
        </div>`).join('');
      const discountRow = discount > 0 ? `
        <div class="order-item" style="border-bottom:none;padding-top:10px;">
          <div class="item-name" style="color:var(--sage);font-size:0.8rem">🏷 香腸搭配飲料折扣</div>
          <div class="item-subtotal" style="color:var(--sage)">−$${discount}</div>
        </div>` : '';
      list.innerHTML = itemRows + discountRow;
    }

    document.getElementById('totalAmount').textContent = `$${currentTotal}`;
    document.getElementById('checkoutBtn').disabled = order.length === 0;
  }

  // ── Checkout ──
  function openCheckout() {
    if (!order.length) return;

    const discount = calcDiscount();
    const discountLine = discount > 0 ? `
      <div class="receipt-row" style="color:var(--sage)">
        <span>🏷 香腸搭配飲料折扣</span>
        <span>−$${discount}</span>
      </div>` : '';
    document.getElementById('receiptItems').innerHTML =
      order.map(o => `
        <div class="receipt-row">
          <span>${o.name} × ${o.qty}</span>
          <span>$${o.price * o.qty}</span>
        </div>`).join('') + discountLine;

    document.getElementById('receiptTotal').textContent = `$${currentTotal}`;
    document.getElementById('cashInput').value = currentTotal;
    document.getElementById('changeDisplay').textContent = '$0';
    document.getElementById('changeDisplay').className = 'change-amount';
    // highlight matching quick button if any
    updateQuickHighlight(currentTotal);
    document.getElementById('checkoutModal').classList.add('show');
    setTimeout(() => document.getElementById('cashInput').focus(), 100);
  }

  function closeCheckout() {
    document.getElementById('checkoutModal').classList.remove('show');
  }

  function setQuickCash(amount) {
    document.getElementById('cashInput').value = amount;
    updateQuickHighlight(amount);
    calcChange();
  }

  function onCashInput() {
    const val = parseInt(document.getElementById('cashInput').value) || 0;
    updateQuickHighlight(val);
    calcChange();
  }

  function updateQuickHighlight(amount) {
    document.querySelectorAll('.btn-quick').forEach(b => {
      b.classList.toggle('active', parseInt(b.textContent.replace('$','')) === amount);
    });
  }

  function calcChange() {
    const cash = parseInt(document.getElementById('cashInput').value) || 0;
    const change = cash - currentTotal;
    const el = document.getElementById('changeDisplay');
    if (!document.getElementById('cashInput').value) {
      el.textContent = '—';
      el.className = 'change-amount';
    } else if (change < 0) {
      el.textContent = `不足 $${Math.abs(change)}`;
      el.className = 'change-amount insufficient';
    } else {
      el.textContent = `$${change}`;
      el.className = 'change-amount';
    }
  }

  function confirmCheckout() {
    const cash = parseInt(document.getElementById('cashInput').value) || 0;
    if (cash < currentTotal) {
      document.getElementById('cashInput').focus();
      return;
    }
    const change = cash - currentTotal;

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'save',
        items: order.map(o => ({ name: o.name, qty: o.qty, subtotal: o.price * o.qty })),
        total: currentTotal,
        cash,
        change
      })
    }).catch(() => {});

    closeCheckout();
    clearOrder();
  }

  // ── Records ──
  function loadRecords() {
    const today = new Date();
    const dateStr = today.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('recordsDate').textContent = dateStr;
    document.getElementById('recordsSummary').style.display = 'none';
    document.getElementById('recordsBody').innerHTML = '<div class="records-loading">載入中⋯</div>';

    fetch(APPS_SCRIPT_URL, { redirect: 'follow' })
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(renderRecords)
      .catch(err => {
        document.getElementById('recordsBody').innerHTML = `
          <div class="records-empty">
            ⚠️ 無法載入記錄<br>
            <span style="font-size:0.75rem;line-height:2">
              請確認 Apps Script 已重新部署（新版本）<br>
              部署 → 管理部署作業 → 編輯 → 版本選「新版本」→ 部署
            </span>
          </div>`;
      });
  }

  function renderRecords(orders) {
    if (!orders.length) {
      document.getElementById('recordsBody').innerHTML =
        '<div class="records-empty">— 今日尚無訂單紀錄 —<br><span style="font-size:0.75rem">前往收銀台結帳後即會顯示</span></div>';
      document.getElementById('recordsSummary').style.display = 'none';
      return;
    }

    const totalRev = orders.reduce((s, o) => s + o.total, 0);
    const avgOrder = Math.round(totalRev / orders.length);

    document.getElementById('sumCount').textContent = orders.length;
    document.getElementById('sumTotal').textContent = `$${totalRev}`;
    document.getElementById('sumAvg').textContent = `$${avgOrder}`;
    document.getElementById('recordsSummary').style.display = 'flex';

    const rows = orders.map(o => {
      const items = o.items.split('、').map(i => `<span style="display:block">${i}</span>`).join('');
      const cashCell = o.cash != null ? `$${o.cash}` : '—';
      const changeCell = o.change != null ? `$${o.change}` : '—';
      return `
        <tr data-row="${o.row}">
          <td class="td-time">${o.time.substring(5)}</td>
          <td class="td-items">${items}</td>
          <td class="td-total">$${o.total}</td>
          <td class="td-cash">${cashCell}</td>
          <td class="td-change">${changeCell}</td>
          <td class="td-action">
            <button class="btn-delete" onclick="askDelete(${o.row}, '${o.time.substring(5)}')">刪除</button>
          </td>
        </tr>`;
    }).join('');

    document.getElementById('recordsBody').innerHTML = `
      <table class="records-table">
        <thead>
          <tr>
            <th>時間</th>
            <th>品項明細</th>
            <th>合計</th>
            <th>收款</th>
            <th>找零</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // ── Delete ──
  function askDelete(row, timeLabel) {
    pendingDeleteRow = row;
    document.getElementById('confirmDelText').innerHTML =
      `確定要刪除 <strong>${timeLabel}</strong> 這筆訂單嗎？<br>此操作無法復原。`;
    document.getElementById('confirmDel').classList.add('show');
  }

  function closeConfirmDel() {
    pendingDeleteRow = null;
    document.getElementById('confirmDel').classList.remove('show');
  }

  function doDelete() {
    if (!pendingDeleteRow) return;
    const row = pendingDeleteRow;
    closeConfirmDel();

    // Optimistic remove from table
    const tr = document.querySelector(`tr[data-row="${row}"]`);
    if (tr) tr.style.opacity = '0.3';

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', row })
    }).catch(() => {});

    setTimeout(loadRecords, 1200);
  }

  // ── Init ──
  renderOrder();
</script>
</body>
</html>
