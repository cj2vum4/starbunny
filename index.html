<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>腸寶圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:   #f4ede0;
      --paper2:  #ede4d3;
      --ink:     #2b1d0e;
      --ink-light: #6b4f35;
      --accent:  #9c4a1a;
      --accent2: #c47b3a;
      --sage:    #6b7c5c;
      --rule:    #c8b89a;
      --white:   #fdf9f3;
    }

    body {
      font-family: 'Noto Serif TC', serif;
      background-color: var(--paper);
      background-image:
        repeating-linear-gradient(
          0deg, transparent, transparent 27px,
          rgba(180,160,130,0.12) 27px, rgba(180,160,130,0.12) 28px
        );
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--ink);
      color: var(--paper);
      text-align: center;
      padding: 28px 20px 22px;
      position: relative;
      overflow: hidden;
    }

    header::before, header::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 3px;
    }
    header::before { top: 6px; background: repeating-linear-gradient(90deg, var(--accent2) 0, var(--accent2) 8px, transparent 8px, transparent 14px); }
    header::after  { bottom: 6px; background: repeating-linear-gradient(90deg, var(--accent2) 0, var(--accent2) 8px, transparent 8px, transparent 14px); }

    .header-inner {
      display: inline-block;
      border: 1px solid var(--accent2);
      padding: 10px 36px;
      position: relative;
    }

    .header-inner::before, .header-inner::after {
      content: '✦';
      position: absolute;
      color: var(--accent2);
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
    }
    .header-inner::before { left: -18px; }
    .header-inner::after  { right: -18px; }

    header h1 {
      font-family: 'Playfair Display', 'Noto Serif TC', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--paper);
    }

    header p {
      font-size: 0.72rem;
      letter-spacing: 0.35em;
      color: var(--accent2);
      margin-top: 5px;
      text-transform: uppercase;
    }

    /* ── Layout ── */
    .container {
      display: flex;
      gap: 20px;
      padding: 24px 20px;
      max-width: 980px;
      margin: 0 auto;
    }

    /* ── Section label ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--ink-light);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .section-label::before, .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* ── Menu ── */
    .menu { flex: 1.5; }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
      gap: 10px;
    }

    .item-btn {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 16px 10px 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
      position: relative;
      box-shadow: 2px 3px 0 var(--paper2);
    }

    .item-btn::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px dashed transparent;
      border-radius: 2px;
      transition: border-color 0.18s;
      pointer-events: none;
    }

    .item-btn:hover {
      background: #fff9f2;
      border-color: var(--accent);
      transform: translate(-1px, -1px);
      box-shadow: 3px 4px 0 var(--accent2);
    }

    .item-btn:hover::after { border-color: var(--accent2); }

    .item-btn:active {
      transform: translate(0, 0);
      box-shadow: 1px 1px 0 var(--paper2);
    }

    .item-btn .name {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .item-btn .price {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--white);
      background: var(--accent);
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    /* ── Order Panel ── */
    .order-panel {
      flex: 1;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      box-shadow: 3px 4px 0 var(--paper2);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 130px);
      position: sticky;
      top: 20px;
    }

    .order-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--rule);
    }

    .order-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .order-list::-webkit-scrollbar { width: 4px; }
    .order-list::-webkit-scrollbar-track { background: transparent; }
    .order-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

    .order-empty {
      text-align: center;
      color: var(--rule);
      margin-top: 44px;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      line-height: 2;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 2px;
      border-bottom: 1px dashed var(--rule);
    }

    .order-item .item-name {
      flex: 1;
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1.4;
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--rule);
      background: var(--paper);
      border-radius: 2px;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--ink-light);
      font-weight: 700;
      line-height: 1;
      transition: all 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover { background: var(--paper2); border-color: var(--accent); color: var(--accent); }

    .qty-num {
      min-width: 22px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
    }

    .item-subtotal {
      min-width: 48px;
      text-align: right;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* ── Footer ── */
    .order-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--rule);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--rule);
    }

    .total-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--ink-light);
      text-transform: uppercase;
    }

    .total-amount {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .btn-row { display: flex; gap: 8px; }

    .btn-clear {
      flex: 1;
      padding: 11px;
      border: 1px solid var(--rule);
      background: transparent;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.8rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.15em;
      color: var(--ink-light);
      transition: all 0.15s;
    }

    .btn-clear:hover { background: var(--paper); border-color: var(--ink-light); }

    .btn-checkout {
      flex: 2;
      padding: 11px;
      border: none;
      background: var(--ink);
      color: var(--paper);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.2em;
      font-weight: 600;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn-checkout::before {
      content: '';
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 2px;
      pointer-events: none;
    }

    .btn-checkout:hover { background: var(--accent); }
    .btn-checkout:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(43,29,14,0.65);
      z-index: 100;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 32px 28px 28px;
      max-width: 360px;
      width: 92%;
      box-shadow: 6px 8px 0 var(--paper2), 0 20px 60px rgba(43,29,14,0.3);
      text-align: center;
      position: relative;
    }

    .modal::before {
      content: '✦  收據  ✦';
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.4em;
      color: var(--accent2);
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--ink);
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--rule);
    }

    .receipt-items {
      text-align: left;
      font-size: 0.85rem;
      line-height: 2;
      padding: 4px 0 12px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--rule);
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      color: var(--ink-light);
    }

    .receipt-row span:last-child { color: var(--accent); font-weight: 600; }

    .receipt-total {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--accent);
      margin: 14px 0 22px;
    }

    .btn-confirm {
      padding: 12px 40px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: 'Noto Serif TC', serif;
      letter-spacing: 0.2em;
      transition: all 0.15s;
    }

    .btn-confirm:hover { background: var(--accent); border-color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 620px) {
      .container { flex-direction: column; padding: 16px 14px; }
      .order-panel { position: static; max-height: none; }
      header h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>腸寶圖</h1>
    <p>Sausage Treasure Map · 手作香腸小攤</p>
  </div>
</header>

<div class="container">
  <div class="menu">
    <div class="section-label">本日菜單</div>
    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <div class="order-panel">
    <div class="order-header">
      <div class="section-label" style="margin-bottom:0">本單明細</div>
    </div>
    <div class="order-list" id="orderList">
      <div class="order-empty">— 尚無品項 —<br><span style="font-size:0.75rem;color:#c8b89a">點選左側加入訂單</span></div>
    </div>
    <div class="order-footer">
      <div class="total-row">
        <span class="total-label">Total</span>
        <span class="total-amount" id="totalAmount">$0</span>
      </div>
      <div class="btn-row">
        <button class="btn-clear" onclick="clearOrder()">清　除</button>
        <button class="btn-checkout" id="checkoutBtn" onclick="checkout()" disabled>結　帳</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>腸寶圖</h3>
    <div class="receipt-items" id="receiptItems"></div>
    <div class="receipt-total" id="receiptTotal"></div>
    <button class="btn-confirm" onclick="closeModal()">完成結帳</button>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwilucXQ-BSXgXSh7NpQQxI77eYOmYSChWmizG8VyEXBy7_ZoG0oSG8VkzHDMH8PIwClA/exec';

  const MENU = [
    { name: '花切香腸',       price: 50  },
    { name: '麻辣香腸',       price: 70  },
    { name: '高粱香腸',       price: 60  },
    { name: '飛魚卵香腸',     price: 70  },
    { name: '墨魚香腸',       price: 90  },
    { name: '香酥米腸',       price: 50  },
    { name: '寶藏箱',         price: 100 },
    { name: '深海藏寶',       price: 150 },
    { name: '香腸＋蜂蜜水',  price: 90  },
    { name: '香腸＋奶茶/奶綠', price: 90 },
    { name: '咖哩飯',         price: 100 },
  ];

  let order = [];

  const grid = document.getElementById('menuGrid');
  MENU.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'item-btn';
    btn.innerHTML = `<div class="name">${item.name}</div><div class="price">$ ${item.price}</div>`;
    btn.onclick = () => addItem(idx);
    grid.appendChild(btn);
  });

  function addItem(idx) {
    const { name, price } = MENU[idx];
    const existing = order.find(o => o.name === name);
    existing ? existing.qty++ : order.push({ name, price, qty: 1 });
    renderOrder();
  }

  function changeQty(name, delta) {
    const item = order.find(o => o.name === name);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) order = order.filter(o => o.name !== name);
    renderOrder();
  }

  function clearOrder() {
    order = [];
    renderOrder();
  }

  function renderOrder() {
    const list = document.getElementById('orderList');
    const total = order.reduce((s, o) => s + o.price * o.qty, 0);

    list.innerHTML = order.length === 0
      ? '<div class="order-empty">— 尚無品項 —<br><span style="font-size:0.75rem;color:#c8b89a">點選左側加入訂單</span></div>'
      : order.map(o => `
          <div class="order-item">
            <div class="item-name">${o.name}</div>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty('${o.name}', -1)">−</button>
              <span class="qty-num">${o.qty}</span>
              <button class="qty-btn" onclick="changeQty('${o.name}', 1)">+</button>
            </div>
            <div class="item-subtotal">$${o.price * o.qty}</div>
          </div>`).join('');

    document.getElementById('totalAmount').textContent = `$${total}`;
    document.getElementById('checkoutBtn').disabled = order.length === 0;
  }

  function checkout() {
    if (!order.length) return;
    const total = order.reduce((s, o) => s + o.price * o.qty, 0);

    document.getElementById('receiptItems').innerHTML = order.map(o => `
      <div class="receipt-row">
        <span>${o.name} × ${o.qty}</span>
        <span>$${o.price * o.qty}</span>
      </div>`).join('');

    document.getElementById('receiptTotal').textContent = `合計　$${total}`;
    document.getElementById('modalOverlay').classList.add('show');

    if (APPS_SCRIPT_URL) {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: order.map(o => ({ name: o.name, qty: o.qty, subtotal: o.price * o.qty })),
          total
        })
      }).catch(() => {});
    }
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    clearOrder();
  }
</script>
</body>
</html>
